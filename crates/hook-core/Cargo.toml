[package]
name = "hook-core"
version = "0.2.1"
edition = "2021"
rust-version = "1.77"
publish = false
license = "AGPL-3.0-only"
description = "The backend every Hook desktop product links: account, chats, sync, coding agents, previews and the chat turn"

[features]
# The desktop products (Hook, Hook Workspace, the phone). The browser's host
# (`crates/hook-host`) links this crate without Tauri: it has no window, no tray
# and no plugins, and every Tauri-typed module is gated on this feature.
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog"]
# The desktop chat app owns the tray; the phone and Workspace do not.
tray = ["desktop", "tauri/tray-icon"]

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "gzip",
] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2.0.0-rc.8", optional = true }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
base64 = "0.23.1"
