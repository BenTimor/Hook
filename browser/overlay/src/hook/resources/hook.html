<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hook</title>
    <link rel="stylesheet" href="hook.css">
  </head>
  <body>
    <!-- Until the page knows whether there is an account, there is nothing to
         draw: the first answer can take a second or two, because a browser with
         no host running starts one (browser/host/hook_host.cc). Say so rather
         than showing an empty window. -->
    <p class="boot" id="boot">Starting Hook…</p>
    <!-- One of these two is shown. The gate is the shared sign-in card, mounted
         from panel.mjs; the seam is the Step 1 proof plus the dock, and only a
         signed-in page ever creates the dock. -->
    <div class="gate" id="gate" hidden></div>
    <main class="seam" id="seam" hidden>
      <div class="mark" aria-hidden="true"></div>
      <h1>Hook</h1>
      <p class="lede">Hook Browser</p>
      <p class="status" id="status">Loading the tab list…</p>
      <ol class="tabs" id="tabs"></ol>
      <p class="note">
        Served from our own pak, reading live browser state over mojom.
      </p>
    </main>
    <!-- panel.mjs is imported by hook.ts, and only when there is a session: it
         carries the dock *and* the sign-in card, and the page must mount exactly
         one of them. -->
    <script type="module" src="hook.js"></script>
  </body>
</html>
