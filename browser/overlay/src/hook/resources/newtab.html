<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="light">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New tab</title>
    <link rel="stylesheet" href="newtab.css">
  </head>
  <body>
    <!-- Hook's new tab page. A tab page, not top chrome: it has the whole
         window, so it is a greeting and a way back to the two surfaces that
         exist (the gate with the dock, and the side panel). -->
    <main class="ntp">
      <div class="ntp-mark" aria-hidden="true"></div>
      <p class="ntp-kicker">Hook Browser</p>
      <h1 class="ntp-greeting" id="greeting">Hello.</h1>
      <p class="ntp-copy">
        The same window, the same account, the same conversation as the desktop
        app — one page in it is ours.
      </p>
      <nav class="ntp-chips" aria-label="Where to go">
        <a class="ntp-chip" href="chrome://hook/">
          <span class="ntp-chip-title">Chat</span>
          <span class="ntp-chip-note">The dock, at 380px</span>
        </a>
        <a class="ntp-chip" href="chrome://hook-panel/">
          <span class="ntp-chip-title">Side panel</span>
          <span class="ntp-chip-note">Pinned beside a page</span>
        </a>
        <a class="ntp-chip" href="https://hookcode.io">
          <span class="ntp-chip-title">Hook on the web</span>
          <span class="ntp-chip-note">Account and downloads</span>
        </a>
      </nav>
      <p class="ntp-note">Step 2 of the browser POC. The tab strip is still Chrome's.</p>
    </main>
    <script type="module" src="newtab.js"></script>
  </body>
</html>
