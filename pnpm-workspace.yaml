packages:
  - "apps/*"
  - "packages/*"

# One pinned version per third-party library, shared by every Hook product.
# A second app that resolves a different React would break the shared UI
# package, so apps reference `catalog:` instead of a range.
catalog:
  "@fontsource-variable/inter": "5.3.0"
  "@fontsource-variable/jetbrains-mono": "5.3.0"
  "@radix-ui/react-dropdown-menu": "2.2.1"
  "@tauri-apps/api": "2.12.4"
  "@tauri-apps/plugin-dialog": "^2.8.4"
  "@tauri-apps/plugin-opener": "^2.7.2"
  "@tailwindcss/vite": "4.3.5"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "@vitejs/plugin-react": "6.2.1"
  lucide-react: "1.70.0"
  motion: "^14.12.0"
  react: "19.3.1"
  react-dom: "19.3.1"
  react-markdown: "10.1.0"
  remark-gfm: "4.0.1"
  shiki: "4.6.0"
  sonner: "2.0.8"
  tailwindcss: "4.3.5"
  typescript: "5.9.3"
  vite: "8.3.6"
  zustand: "5.1.0"
