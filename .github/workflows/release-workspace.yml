name: Release Hook Workspace

# The second product's installer, published beside the chat app's.
#
# Same shape as release-app.yml: a cheap fingerprint decides whether this push
# can change Hook Workspace at all, an unchanged build is skipped, changed
# source without a version bump fails, and the new installer is uploaded under
# its versioned name before the index is swapped.
#
#   product id: workspace            version: apps/workspace/package.json
#   index:      releases.workspace.json   route: /api/releases/workspace
#
# Required repository secrets (same as the chat release):
#   DEPLOY_SSH_KEY      private key for root@167.233.58.139
#   DEPLOY_KNOWN_HOSTS  pinned ssh-keyscan output for that host
on:
  push:
    branches: [main]
    paths:
      - "apps/workspace/**"
      - "packages/**"
      - "crates/hook-core/**"
      - "harness.config.ci.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "release.config.json"
      - "msix/workspace/**"
      - "scripts/build-msix.mjs"
      - "scripts/app-source-hash.mjs"
      - "scripts/products.mjs"
      - "scripts/release-gate.mjs"
      - "scripts/build-release-manifest.mjs"
      - "scripts/merge-release-index.mjs"
      - "scripts/fetch-pi-runtime.mjs"
      - "scripts/fetch-git.mjs"
      - ".github/workflows/release-workspace.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the application source is unchanged"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-hook-workspace
  cancel-in-progress: false

jobs:
  check:
    name: Decide whether a build is needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      version: ${{ steps.gate.outputs.version }}
      source_hash: ${{ steps.gate.outputs.source_hash }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Compare with the published release
        id: gate
        env:
          HOOK_RELEASES_URL: https://hookcode.io
        run: node scripts/release-gate.mjs --product workspace ${{ inputs.force && '--force' || '' }}

  build:
    name: Build Windows installer
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: "10"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # harness.config.toml is gitignored locally; the committed CI copy has
      # the hookcode.io proxy settings and no secrets.
      - name: Use CI harness config
        shell: pwsh
        run: Copy-Item harness.config.ci.toml harness.config.toml -Force

      - name: Typecheck every package
        run: pnpm typecheck

      # A broken test must not reach a published installer. Only hook-core is
      # tested here: the app crates bundle the engine, which the build step
      # fetches.
      - name: Rust tests
        run: cargo test -p hook-core

      - name: Build Hook Workspace
        run: pnpm workspace:app:build

      - name: Collect installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem "target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw "Tauri did not produce an NSIS installer." }
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $exe.FullName "release/Hook-Workspace-${{ needs.check.outputs.version }}-setup.exe" -Force
          Write-Host "installer: $($exe.Name) ($([math]::Round($exe.Length / 1MB, 1)) MB)"

      # Exits cleanly while msix/workspace/identity.json is unconfigured.
      - name: Package Microsoft Store MSIX
        run: node scripts/build-msix.mjs --product workspace

      - name: Write version manifest
        env:
          HOOK_RELEASE_NOTES: ${{ github.event.head_commit.message }}
          HOOK_SOURCE_HASH: ${{ needs.check.outputs.source_hash }}
        run: >
          node scripts/build-release-manifest.mjs
          "release/Hook-Workspace-${{ needs.check.outputs.version }}-setup.exe"
          release/latest-workspace.json
          --product workspace

      - uses: actions/upload-artifact@v7
        with:
          name: hook-workspace-release
          path: release/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Publish to hookcode.io
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: actions/download-artifact@v8
        with:
          name: hook-workspace-release
          path: release

      - name: Merge release index
        env:
          HOOK_SERVER: https://hookcode.io
        run: >
          node scripts/merge-release-index.mjs
          --manifest release/latest-workspace.json
          --out release/releases.workspace.json
          --server "$HOOK_SERVER"
          --keep 5
          --product workspace

      - name: Install SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Missing DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS repository secrets."
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      # New files first, the index last. This product's index is its own file,
      # so publishing Workspace cannot move the chat app's downloads.
      - name: Upload installer and release index
        env:
          DEPLOY_HOST: root@167.233.58.139
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          SSH=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=10)
          DIR=/opt/hook-web/data/releases
          KEEP=$(node -e "const i=require('./release/releases.workspace.json'); process.stdout.write(Object.values(i.releases).map(r=>r.file).join(' '))")
          ssh "${SSH[@]}" "$DEPLOY_HOST" "mkdir -p '$DIR' && chmod 755 '$DIR'"
          scp "${SSH[@]}" "release/Hook-Workspace-$VERSION-setup.exe" "$DEPLOY_HOST:$DIR/Hook-Workspace-$VERSION-setup.exe.new"
          scp "${SSH[@]}" release/releases.workspace.json "$DEPLOY_HOST:$DIR/releases.workspace.json.new"
          ssh "${SSH[@]}" "$DEPLOY_HOST" "DIR='$DIR' KEEP='$KEEP' VERSION='$VERSION' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DIR"
          chmod 644 "Hook-Workspace-$VERSION-setup.exe.new" releases.workspace.json.new
          mv "Hook-Workspace-$VERSION-setup.exe.new" "Hook-Workspace-$VERSION-setup.exe"
          mv releases.workspace.json.new releases.workspace.json
          # Only this product's installers: the chat app's files share the folder.
          for file in Hook-Workspace-*.exe; do
            [ -e "$file" ] || continue
            case " $KEEP " in
              *" $file "*) ;;
              *) rm -f "$file" ;;
            esac
          done
          ls -lh releases.workspace.json *.exe
          REMOTE
          node -p "'published Hook Workspace ' + require('./release/latest-workspace.json').version"
