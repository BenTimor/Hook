name: CI

# Checks every pull request (and any manual run) without touching the server.
# Deployment on main is in deploy-waitlist.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  waitlist:
    name: Waitlist build & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API regression tests
        run: pnpm waitlist:test

      # waitlist:build runs `tsc --noEmit` (whole project) before vite build.
      - name: Build landing page
        run: pnpm waitlist:build
