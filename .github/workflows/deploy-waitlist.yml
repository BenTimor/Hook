name: Deploy waitlist

# A `deploy-*` tag on the tip of main deploys https://hookcode.io. A push to
# main only runs the checks; production moves when a person tags the commit they
# mean to ship, so a merge cannot deploy by accident and a stale commit cannot
# roll production back (the `gate` job refuses a tag main has moved past).
#
# Tag format is only the prefix; pick a name you can find again:
#
#   git switch main && git pull
#   git tag deploy-$(date +%Y-%m-%d)     # or deploy-2, deploy-auth-fix
#   git push origin deploy-$(date +%Y-%m-%d)
#
# To deploy without a tag — an emergency, or a server fix that cannot wait for
# the next merge — run `./scripts/deploy-waitlist.sh` from the repository. It
# needs no GitHub at all, and it is the same script this workflow calls.
#
# Reuses that script so CI and a local deploy stay identical; the only
# difference is that the built site is passed from the verify job instead of
# being rebuilt (SKIP_BUILD=1). Path filters are gone on purpose: they do not
# apply to tag pushes, and a tag is already a deliberate choice.
#
# The script fingerprints what the server container runs and rebuilds the image
# only when that changed, so copy, layout and stylesheet changes ship a tarball
# and leave the API container alone.
#
# Required repository secrets:
#   DEPLOY_SSH_KEY      private key whose public half is in
#                       root@167.233.58.139:~/.ssh/authorized_keys
#                       (comment: "github-actions hookcode.io deploy")
#   DEPLOY_KNOWN_HOSTS  pinned `ssh-keyscan 167.233.58.139` output
#
# Rotation: generate a new keypair, replace that line in authorized_keys, then
# update both secrets. Nothing else needs to change.
on:
  push:
    tags:
      - "deploy-*"

permissions:
  contents: read

# Serialize deploys; never cancel one halfway through. The site is streamed
# into the live directory, so a cancelled run could leave it half-unpacked —
# unlike a superseded installer build, which publishes nothing until the end.
concurrency:
  group: deploy-waitlist
  cancel-in-progress: false

jobs:
  # The tag is the whole gate, so it has to mean something: main is the only
  # branch whose checks ran, and a tag on an older commit would ship that older
  # tree over a newer one. Both are one comparison away, before anything is
  # built or uploaded. A merge landing between the tag and this run fails the
  # deploy instead of shipping a tree main has already moved past; re-tag the
  # new tip.
  gate:
    name: Tag is on the tip of main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compare the tagged commit with main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          tip="$(git rev-parse FETCH_HEAD)"
          tagged="$(git rev-parse HEAD)"
          if [ "$tagged" != "$tip" ]; then
            echo "::error::$GITHUB_REF_NAME is $tagged, but main is at $tip. A deploy tag must point at the tip of main: merge first, then tag the merge commit."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is the tip of main ($tagged)."

  verify:
    name: Verify build & tests
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from package.json's `packageManager`; passing it
      # here too makes the action fail with "multiple versions specified".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API regression tests
        run: pnpm waitlist:test

      - name: Build landing page
        run: pnpm waitlist:build

      - uses: actions/upload-artifact@v7
        with:
          name: dist-waitlist
          path: dist-waitlist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: dist-waitlist
          path: dist-waitlist

      - name: Install SSH credentials
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::Missing DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS repository secrets."
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          # Pinned host keys: ssh then refuses to talk to an unexpected server.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy
        env:
          DEPLOY_HOST: root@167.233.58.139
          DEPLOY_KEY: /home/runner/.ssh/deploy_key
          SKIP_BUILD: "1"
        run: ./scripts/deploy-waitlist.sh
