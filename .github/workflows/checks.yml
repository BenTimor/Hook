name: Checks

# The static gate and the Rust tests, for every push to `main` that can change a
# desktop product and for every pull request.
#
# This workflow does not build an installer. Installers are built, published and
# handed to the Microsoft Store from the machine that makes the release
# (`pnpm release`, see `docs/releasing.md`): the download channel and the Store
# channel are one deliberate action by a person who already has the toolchain
# and the MSIX identity, instead of a twenty-minute Windows build per push.
#
# What still has to be true before a push is good: the typecheck, both window
# builds, the server suite and `cargo test -p hook-core`. That is what this file
# runs.
on:
  push:
    branches: [main]
    paths:
      - "apps/chat/**"
      - "apps/workspace/**"
      - "apps/mobile/**"
      - "packages/**"
      - "crates/**"
      - "harness.config.ci.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "scripts/app-source-hash.mjs"
      - "scripts/check-licenses.mjs"
      - "Cargo.lock"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/products.mjs"
      - "scripts/release-gate.mjs"
      - "scripts/release.sh"
      - "scripts/merge-release-index.mjs"
      - "scripts/fetch-pi-runtime.mjs"
      - "scripts/fetch-git.mjs"
      - "browser/**"
      - ".github/workflows/checks.yml"
  # A pull request gets the same checks whatever it touches: the path filter
  # above exists to keep main quiet, not to hide a broken import in review.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a running check; nothing here publishes anything.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, frontends and server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from package.json's `packageManager`; passing it
      # here too makes the action fail with "multiple versions specified".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Hook is AGPL-3.0-only and dual-licensed commercially. A dependency under
      # strong copyleft or a source-available license would decide Hook's license
      # for it, so a new one has to fail on the pull request that adds it. Runs
      # after install because it reads the resolved npm tree, and the Rust half
      # asks cargo for the graph in Cargo.lock.
      - name: Check dependency licenses
        run: pnpm test:licenses

      # The CLA gate is what stands between a patch and the tree. Its parsing
      # rules are tested here because `cla.yml` runs on `pull_request_target`,
      # where a mistake is expensive: a false "signed" lets through code the
      # commercial license can never cover, and that cannot be undone.
      - name: Test the CLA gate's logic
        run: pnpm test:cla

      - name: Run API regression tests
        run: pnpm waitlist:test

      - name: Test the release gate
        run: pnpm test:release

      # The document dialect is what a Workspace document *is*: the parser, the
      # live editor's deletion repair and the read-only renderer are pure
      # functions over Markdown, so they are tested without a window.
      - name: Test the document dialect
        run: pnpm test:markdown

      # The greeting is shared copy and shared rules: six clock windows, a
      # per-window shuffle and the two phrases allowed a first name. Pure
      # functions, so no window and no device.
      - name: Test the greeting catalog
        run: pnpm test:greetings

      # The browser tooling drives a Chromium checkout that CI does not have, so
      # what is tested here is the part that decides a rebase's fate: the pin and
      # version parsers, the patch-series reader and the overlay rule that stops a
      # copy of an upstream file becoming an invisible fork.
      - name: Test the browser tooling
        run: pnpm browser:test

      # The only static gate: every workspace package plus the site.
      - name: Typecheck
        run: pnpm typecheck

      # tsc per app is not enough: these catch a bad import that only shows up
      # when Vite resolves the graph (a shared package not declared, for one).
      - name: Build the chat window
        run: pnpm build

      - name: Build the Workspace window
        run: pnpm workspace:build

      # The phone shell is a third Vite graph. It is not packaged here — that
      # needs Xcode and the Android SDK — but a broken import must fail on the
      # push that broke it, not in a device build three weeks later.
      - name: Build the phone window
        run: pnpm mobile:build

  rust-test:
    name: Rust tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # config.rs include_str!s this file, so every cargo command needs it.
      - name: Use CI harness config
        shell: pwsh
        run: Copy-Item harness.config.ci.toml harness.config.toml -Force

      # hook-core holds every test that matters (SSE framing, the tool loop, the
      # guard policy, sync, the update policy). It needs no node_modules: the
      # engine tests skip themselves when the bundled runtime is not there yet,
      # and the guard test only needs `node`.
      - name: Rust tests
        run: cargo test -p hook-core

      # The same tests with the window taken out. Tauri is a feature, and this is
      # the build `crates/hook-host` links: without it in CI, a change that
      # reaches for an `AppHandle` below `lib.rs` compiles everywhere until the
      # browser's own host is built, which no runner here does.
      - name: Rust tests without the window
        run: cargo test -p hook-core --no-default-features

      # The browser's host binary: no Tauri, no window, a loopback channel. It is
      # not packaged here (that is a Chromium build), but it has to keep linking.
      - name: Build the browser host
        run: cargo build -p hook-host
