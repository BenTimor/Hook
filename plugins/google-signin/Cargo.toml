[package]
name = "tauri-plugin-google-signin"
version = "0.1.0"
description = "Google sign-in through the phone's own account sheet"
edition = "2021"
rust-version = "1.77"
publish = false
license = "AGPL-3.0-only"
# Tauri discovers a plugin's permissions and Android module by this marker; a
# path crate without it is an ordinary library and `google-signin:default`
# would be rejected as an unknown permission.
links = "tauri-plugin-google-signin"

[lib]
name = "tauri_plugin_google_signin"

[dependencies]
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
