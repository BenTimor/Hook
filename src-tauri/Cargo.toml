[package]
name = "hook"
version = "0.2.0"
description = "Hook — a local, single-provider AI chat harness"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "gzip",
] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.0.0-rc.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
