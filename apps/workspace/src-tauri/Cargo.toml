[package]
name = "hook-workspace"
version = "0.1.2"
description = "Hook Workspace — projects, boards, tasks and documents"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hook_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
hook-core = { path = "../../../crates/hook-core" }
# Declared here as well as in hook-core: tauri-build discovers the plugin
# permission sets from this crate's dependency graph.
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.0.0-rc.8"
