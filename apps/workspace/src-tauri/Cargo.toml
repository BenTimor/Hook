[package]
name = "hook-workspace"
version = "0.1.8"
description = "Hook Workspace — projects, boards, tasks and documents"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

# Desktop only: `staticlib` and `cdylib` exist for Android and iOS and cost an
# extra optimised codegen and LTO pass each. Add them back when this product
# targets mobile — see apps/chat/src-tauri/Cargo.toml.
[lib]
name = "hook_workspace_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
hook-core = { path = "../../../crates/hook-core" }
# Declared here as well as in hook-core: tauri-build discovers the plugin
# permission sets from this crate's dependency graph.
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.0.0-rc.8"
