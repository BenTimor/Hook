[package]
name = "hook"
version = "0.3.2"
description = "Hook — a local, single-provider AI chat harness"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "hook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
hook-core = { path = "../../../crates/hook-core" }
# Declared here as well as in hook-core: tauri-build discovers the plugin
# permission sets (`opener:default`, `dialog:default`) from this crate's
# dependency graph, and capabilities/default.json asks for them.
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.0.0-rc.8"
