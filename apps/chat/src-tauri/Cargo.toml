[package]
name = "hook"
version = "0.5.0"
description = "Hook — a local, single-provider AI chat harness"
authors = ["Ben Timor"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"

# `staticlib` and `cdylib` are the mobile targets: every crate type gets its
# own optimised codegen and its own LTO pass, so listing them here triples the
# release build. Hook ships NSIS and MSIX, which link the `rlib` only — add
# them back, and only then, when this product targets Android or iOS.
[lib]
name = "hook_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
hook-core = { path = "../../../crates/hook-core", features = ["tray"] }
# Declared here as well as in hook-core: tauri-build discovers the plugin
# permission sets (`opener:default`, `dialog:default`) from this crate's
# dependency graph, and capabilities/default.json asks for them.
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.0.0-rc.8"
